<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CladeForge</title>
    <!-- Inline so a plain-browser `npm run dev` load does not 404 on /favicon.ico;
         the desktop shell uses the bundled icons instead. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%23111827'/%3E%3C/svg%3E" />
    <!-- Set the document language before the bundle runs, so a screen reader in
         a Chinese environment never announces the English bootstrap as English. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cladeforge:lang');
          var lang =
            stored === 'zh' || stored === 'en'
              ? stored
              : (navigator.language || '').toLowerCase().indexOf('zh') === 0
                ? 'zh'
                : 'en';
          document.documentElement.lang = lang;
        } catch (e) {
          /* storage unavailable: keep the default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
